[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthpix"
version = "0.1.2"
authors = [
    { name = "Antonio Terpin", email = "aterpin@ethz.ch" },
    { name = "Alan Bonomi", email = "abonomi@ethz.ch" },
    { name = "Francesco Banelli", email = "fbanelli@ethz.ch" },
]
description = "A lightspeed PIV images generator using JAX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["PIV", "synthetic data", "jax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.6.0",
    "tqdm>=4.67.1",
    "h5py>=3.13.0",
    "ruamel.yaml>=0.18.10",
    "Pillow>=10.0.0",
    "robo-goggles>=0.1.7",
    "numpy>=2.2.6",
    "gdown>=5.2.0",
    "grain>=0.2.13",
    "orbax-checkpoint>=0.11.31",
]

[project.urls]
Homepage = "https://github.com/antonioterpin/synthpix"
Repository = "https://github.com/antonioterpin/synthpix"
Documentation = "https://github.com/antonioterpin/synthpix#readme"
Issues = "https://github.com/antonioterpin/synthpix/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["synthpix*"]
exclude = ["tests*", "docs*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre_commit==4.0.1",
    "matplotlib>=3.10.1",
    "ruff>=0.9.0",
    "basedpyright",
    "pydoclint>=0.8.3",
]
cuda12 = [
    "jax[cuda12]>=0.6.0",
]
download = [
    "gdown>=5.1.0",
    "scipy>=1.10.0",
    "tensorflow-cpu>=2.15.0",
]


# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
        "-ra",
        "--strict-markers",
        "--strict-config",
        "--cov=goggles",
        "--cov-branch",
        "--cov-report=term-missing",
        "--cov-report=html",
        "--cov-report=xml",
]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
        "error",
        "ignore::UserWarning",
        "ignore::DeprecationWarning",
]
markers = [
        "run_explicitly: marks tests that are only run with -m run_explicitly",
        "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# Ruff configuration for linting and modern typing enforcement
[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
# Enable comprehensive rule sets
select = [
    "E",     # pycodestyle errors (style/formatting)
    "W",     # pycodestyle warnings
    "F",     # pyflakes (logical errors)
    "UP",    # pyupgrade (modern Python syntax)
    "I",     # isort (import sorting)
    "N",     # pep8-naming (naming conventions)
    "B",     # flake8-bugbear (potential bugs)
    "PL",    # pylint (code quality)
    "RUF",   # ruff-specific rules
]

# NOTE: issue #229 proposes to remove ignore
# PLR0912 and
# PLR0915
# They are good checks in principle but stil hard to
# respect at the moment
ignore = [
    "PLR2004", # Magic value used in comparison
    "PLR0913", # Too many arguments in function definition
    "N803",    # Argument name should be lowercase (CV standard Ix, Iy, ecc.)
    "N806",    # Variable in function should be lowercase (CV standard Ix, Iy, ecc.)
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
]

# Pydoclint configuration
# Pydoclint is used together with Ruff because
# Ruff hasn't yet implemented all the checks that Pydoclint provides.
# The plan is to migrate to Ruff only when all checks are implemented.
[tool.pydoclint]
style = "google"
skip-checking-short-docstrings = false
allow-init-docstring = true
arg-type-hints-in-docstring = false
check-return-types = false
skip-checking-raises = false

# Pyright configuration for type checking
# We use basedpyright but in this way pylance also
# reads this configuration
[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.10"
include = ["src"]

reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false

reportUnusedImport = false
reportUnusedVariable = false

enableTypeIgnoreComments = false
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.setuptools.dynamic]
version = {attr = "synthpix.__version__"}
