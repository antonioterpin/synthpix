repos:
  # Ruff: lint + autofix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        stages: [pre-commit, pre-push]
        args: ["--fix"]

      # Require typed signatures and documented tests in addition to the
      # shared lint rules. Any remains valid for deliberate invalid inputs
      # and dynamic mocks, which are common in validation tests.
      - id: ruff
        alias: ruff-test-contracts
        name: ruff test signatures and docstrings
        files: ^tests/.*\.py$
        stages: [pre-commit, pre-push]
        args: ["--select", "ANN,D100,D101,D102,D103", "--ignore", "ANN401"]

      - id: ruff-format
        stages: [pre-commit, pre-push]

  # Pydoclint: docstring linting (refer to pyproject.toml for configuration)
  - repo: local
    hooks:
      - id: pydoclint
        name: pydoclint
        entry: uv run pydoclint
        language: system
        types: [python]
        stages: [pre-commit, pre-push]

  # Type checking (BasedPyright)
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

  # Generic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
